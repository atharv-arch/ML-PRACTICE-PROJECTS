name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run linting
        run: |
          pip install flake8
          flake8 backend/app --max-line-length=120 --ignore=E501,W503

      - name: Run unit tests
        working-directory: backend
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Generate sample data
        working-directory: backend
        run: |
          python -m ml.generate_sample_data

      - name: Run ML pipeline
        working-directory: backend
        run: |
          python -m ml.train_model

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t daily-routine-optimizer ./backend

      - name: Verify container starts
        run: |
          docker run -d --name test-app -p 8000:8000 daily-routine-optimizer
          sleep 5
          curl -f http://localhost:8000/api/health || exit 1
          docker stop test-app
